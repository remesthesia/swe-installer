on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['windows-latest', 'ubuntu-latest']

    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.14.x

    - name: Install PyInstaller
      run: |
        pip install pyinstaller

    - name: Build
      run: |
        pyinstaller main.py
